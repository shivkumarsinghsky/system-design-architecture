name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Capacity model and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Capacity tables in sync
        run: python scripts/sync_capacity_tables.py
      - name: Design template (ADR-001)
        run: python scripts/check_design_structure.py
      - name: Internal links
        run: python scripts/check_links.py .

  diagrams:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/check_mermaid.sh .

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -f docker/Dockerfile -t system-design-architecture:ci .
